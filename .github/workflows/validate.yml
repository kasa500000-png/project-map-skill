name: Validate Project Map
on:
  push:
    branches: [main, verify/four-phase-upgrade]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Export tested source
        if: always()
        run: git archive --format=tar.gz --output=/tmp/project-map-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-map-tested-source
          path: /tmp/project-map-source.tar.gz
          retention-days: 3
