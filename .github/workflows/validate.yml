name: Validate Project Map
on:
  push:
    branches: [main, verify/four-phase-upgrade]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Export tested source
        if: always()
        run: git archive --format=tar.gz --output=/tmp/project-map-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-map-tested-source-${{ runner.os }}
          path: /tmp/project-map-source.tar.gz
          retention-days: 3
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Live localhost workbench flow
        env:
          PM_SCREENSHOT_DIR: ${{ runner.temp }}/pm-screens
        run: python tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-map-browser-evidence
          path: ${{ runner.temp }}/pm-screens
          retention-days: 7
