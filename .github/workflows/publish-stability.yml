name: Prepare validated v0.7 source objects
on:
  push:
    branches: [maintenance/stabilize-v07-20261112]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: project-map-stability-publication
  cancel-in-progress: false
jobs:
  prepare-source:
    if: github.repository == 'kasa500000-png/project-map-skill' && github.ref == 'refs/heads/maintenance/stabilize-v07-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1b3363a1af5a2a61842608d3fd1b6abd8fc3d98e
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recreate source trees already validated in run 43166069900
        run: python payload/.maintenance/stability/publish.py --payload payload/.maintenance/stability --target target --report "$RUNNER_TEMP/publication.json"
      - name: Upload source objects without changing workflows or branches
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ../payload/.maintenance/stability/publish-objects.py "$RUNNER_TEMP/publication.json"
          git archive --format=tar.gz --output="$RUNNER_TEMP/project-map-v07-published.tar.gz" HEAD
          echo 'Linux and macOS validation for these exact trees passed in run 43166069900. Browser E2E remains unverified.' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/publication.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stability-publication-result
          path: |
            ${{ runner.temp }}/publication.json
            ${{ runner.temp }}/project-map-v07-published.tar.gz
          retention-days: 7
